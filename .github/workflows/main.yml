name: Construire APK Moi Geomaticien

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Generer APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v5

      - name: Detecter le dossier Flutter
        shell: bash
        run: |
          set -e

          if [ -f "pubspec.yaml" ]; then
            APP_DIR="."
          else
            PUBSPEC_PATH="$(find . -maxdepth 3 -type f -name pubspec.yaml | head -n 1)"

            if [ -z "$PUBSPEC_PATH" ]; then
              echo "Erreur : aucun fichier pubspec.yaml trouve dans le depot."
              exit 1
            fi

            APP_DIR="$(dirname "$PUBSPEC_PATH")"
          fi

          if [ ! -f "$APP_DIR/lib/main.dart" ]; then
            echo "Erreur : lib/main.dart est absent dans $APP_DIR."
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Projet Flutter detecte dans : $APP_DIR"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Afficher la version de Flutter
        shell: bash
        run: flutter --version

      - name: Creer la plateforme Android si necessaire
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"

          if [ ! -d "android" ]; then
            echo "Le dossier android est absent : generation en cours..."

            BACKUP_DIR="$(mktemp -d)"
            cp -R lib "$BACKUP_DIR/lib"
            cp pubspec.yaml "$BACKUP_DIR/pubspec.yaml"

            if [ -d "assets" ]; then
              cp -R assets "$BACKUP_DIR/assets"
            fi

            if [ -d "test" ]; then
              cp -R test "$BACKUP_DIR/test"
            fi

            if [ -f "analysis_options.yaml" ]; then
              cp analysis_options.yaml "$BACKUP_DIR/analysis_options.yaml"
            fi

            flutter create \
              --org com.novateur221 \
              --project-name moi_geomaticien \
              --platforms android \
              .

            rm -rf lib assets test
            cp -R "$BACKUP_DIR/lib" ./lib
            cp "$BACKUP_DIR/pubspec.yaml" ./pubspec.yaml

            if [ -d "$BACKUP_DIR/assets" ]; then
              cp -R "$BACKUP_DIR/assets" ./assets
            fi

            if [ -d "$BACKUP_DIR/test" ]; then
              cp -R "$BACKUP_DIR/test" ./test
            fi

            if [ -f "$BACKUP_DIR/analysis_options.yaml" ]; then
              cp "$BACKUP_DIR/analysis_options.yaml" ./analysis_options.yaml
            fi
          else
            echo "Le dossier android existe deja."
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dependances Flutter
        shell: bash
        run: |
          cd "$APP_DIR"
          flutter pub get

      - name: Construire APK release
        shell: bash
        run: |
          cd "$APP_DIR"
          flutter build apk --release

      - name: Preparer le fichier APK
        shell: bash
        run: |
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             "$GITHUB_WORKSPACE/Moi_Geomaticien.apk"

      - name: Publier APK
        uses: actions/upload-artifact@v6
        with:
          name: Moi-Geomaticien-APK
          path: Moi_Geomaticien.apk
          if-no-files-found: error
          retention-days: 30
