name: Construire APK Moi Geomaticien

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Generer l'APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Afficher la version de Flutter
        run: flutter --version

      - name: Creer Android si necessaire
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            TEMP_SOURCE="$(mktemp -d)"

            cp -R lib "$TEMP_SOURCE/lib"
            cp -R assets "$TEMP_SOURCE/assets"
            cp pubspec.yaml "$TEMP_SOURCE/pubspec.yaml"
            cp analysis_options.yaml "$TEMP_SOURCE/analysis_options.yaml"
            if [ -d "test" ]; then
              cp -R test "$TEMP_SOURCE/test"
            fi

            flutter create \
              --org com.novateur221 \
              --project-name moi_geomaticien \
              --platforms android \
              .

            rm -rf lib assets test
            cp -R "$TEMP_SOURCE/lib" ./lib
            cp -R "$TEMP_SOURCE/assets" ./assets
            cp "$TEMP_SOURCE/pubspec.yaml" ./pubspec.yaml
            cp "$TEMP_SOURCE/analysis_options.yaml" ./analysis_options.yaml
            if [ -d "$TEMP_SOURCE/test" ]; then
              cp -R "$TEMP_SOURCE/test" ./test
            fi
          fi

      - name: Installer les dependances
        run: flutter pub get

      - name: Appliquer le logo comme icone Android
        run: dart run flutter_launcher_icons

      - name: Definir le nom visible de l'application
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:label="moi_geomaticien"', 'android:label="Moi, Géomaticien"')
          manifest.write_text(text, encoding="utf-8")
          PYCODE

      - name: Verifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tester l'application
        run: flutter test

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Moi_Geomaticien_V2.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Moi-Geomaticien-V2-APK
          path: Moi_Geomaticien_V2.apk
          if-no-files-found: error
          retention-days: 30
