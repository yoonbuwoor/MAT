name: moi_geomaticien
description: Le livre de poche et compagnon terrain du géomaticien, par Novateur221.
publish_to: "none"
version: 3.0.1+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/novateur221.png
    - assets/images/moi_geomaticien_logo.png
    - assets/images/app_icon.png
    - assets/images/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FAF7F4"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
